<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>BingeBound</title>
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
      rel="stylesheet" />
    <link rel="stylesheet" href="./style.css" />
    <script src="https://unpkg.com/vue@3.5.43/dist/vue.global.prod.js"></script>
    <script src="https://unpkg.com/vue-router@4.6.4/dist/vue-router.global.prod.js"></script>
  </head>

  <body>
    <div id="app">
      <navbar-component></navbar-component>
      <main>
        <router-view></router-view>
      </main>
    </div>

    <script type="module">
      import('./app.js').catch((error) => {
        const appRoot = document.querySelector('#app');
        appRoot.textContent = `BingeBound could not start: ${error.message}`;
        console.error('BingeBound could not start.', error);
      });
    </script>
  </body>
</html>
